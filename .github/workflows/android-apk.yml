name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run android:sync

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../qanvas.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qanvas-apk
          path: qanvas.apk
          if-no-files-found: error

      - name: Publish PR prerelease with APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="pr-${PR_NUMBER}"
          NOTES="Installable Android APK built from PR #${PR_NUMBER} (\`${HEAD_SHA}\`)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" qanvas.apk --clobber
            gh release edit "$TAG" --title "PR #${PR_NUMBER} APK: ${PR_TITLE}" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" qanvas.apk --target "$HEAD_SHA" --title "PR #${PR_NUMBER} APK: ${PR_TITLE}" --notes "$NOTES" --prerelease
          fi

      - name: Publish main release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          TAG="latest"
          NOTES="Installable Android APK built from \`main\` (\`${SHA}\`)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" qanvas.apk --clobber
            gh release edit "$TAG" --title "Qanvas Android APK (latest)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" qanvas.apk --target "$SHA" --title "Qanvas Android APK (latest)" --notes "$NOTES" --latest
          fi
