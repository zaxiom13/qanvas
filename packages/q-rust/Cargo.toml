[workspace]
members = [
    "crates/q_lex",
    "crates/q_parse",
    "crates/q_eval",
    "crates/q_wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zaxiom13/qanvas"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
